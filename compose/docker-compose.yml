# 운영용. 같은 디렉터리의 .env 필요(.env.example 복사).
# 데이터: ./data(원본·파생물), ./postgres(DB).
name: littledays

services:
  app:
    image: ghcr.io/youngtaeju/littledays:${LITTLEDAYS_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      # .env 의 PORT 는 호스트 포트. 컨테이너 안은 8080 고정.
      PORT: "8080"
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    # 서버 종료 유예(20초)보다 길게.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: littledays
      POSTGRES_DB: littledays
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      # TCP 확인. 최초 initdb 중 임시 서버(소켓 전용)를 준비 완료로 오인 방지.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "littledays", "-d", "littledays"]
      interval: 5s
      timeout: 5s
      retries: 20
