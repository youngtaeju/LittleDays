name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  server:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://littledays:littledays@localhost:5432/littledays
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: littledays
          POSTGRES_PASSWORD: littledays
          POSTGRES_DB: littledays
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U littledays"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: 시스템 패키지 설치
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config zlib1g-dev libheif-dev libheif-plugin-libde265 libheif-plugin-aomenc libheif-plugin-dav1d ffmpeg
      - uses: dtolnay/rust-toolchain@1.99
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: sqlx-cli 설치
        run: cargo install sqlx-cli --version 0.8.6 --locked --no-default-features --features postgres,rustls
      - name: fmt
        run: cargo fmt --check
      - name: 마이그레이션 적용
        run: cargo sqlx migrate run
      - name: clippy (오프라인 .sqlx 검증)
        run: cargo clippy --locked --all-targets -- -D warnings
        env:
          SQLX_OFFLINE: "true"
      - name: sqlx prepare 검사
        run: cargo sqlx prepare --check -- --all-targets
      - name: test
        run: cargo test --locked
      - name: OpenAPI 문서 신선도 검사
        run: cargo run -q --locked -- openapi > ../web/openapi.json && git diff --exit-code ../web/openapi.json

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 의존성 설치
        run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: test
        run: pnpm test
      - name: build
        run: pnpm build
      - name: 생성 타입 신선도 검사
        run: pnpm gen:api:check

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: 이미지 빌드
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          tags: littledays:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 이미지 크기 기록
        run: |
          { echo '```'; docker image ls littledays:ci; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 스모크
        run: bash docker/smoke.sh littledays:ci
